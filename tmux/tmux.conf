# Tmux Configuration
# Comprehensive, modular configuration for enhanced terminal multiplexing
# Designed for productivity, readability, and cross-environment consistency

# ---- Environment and Path Management ----
tmux_dir="$HOME/.config/tmux"
tmux_plugins_dir="$HOME/.tmux/plugins"

set -g mouse on
set -g history-limit 50000   # per-pane scrollback for normal (non-alt-screen) panes

# ---- Plugin Management ----
# Use Tmux Plugin Manager (TPM) for robust plugin handling
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'  # Sensible default configurations

# ---- Navigation and Integration ----
# Seamless navigation between tmux and vim/neovim
set -g @plugin 'christoomey/vim-tmux-navigator'

# ---- Productivity Plugins ----
# System clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Session and Environment Persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # Automatic session saving
set -g @plugin 'tmux-plugins/tmux-online-status'  # Internet connection monitoring

# ---- Resurrect and Continuum Configuration ----
set -g @resurrect-dir "$tmux_dir/resurrect"
set -g @resurrect-save 'S'     # Keybinding to manually save session
set -g @resurrect-restore 'R'  # Keybinding to manually restore session
set -g @continuum-restore 'on' # Automatic session restoration on tmux start

# ---- Terminal and Color Configuration ----
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"  # True color support
set-option -ga terminal-overrides ",xterm-ghostty:Tc"   # Ghostty sets TERM=xterm-ghostty

# ---- Theme: PHOSPHOR — true-black / terminal-green ----
# Palette: #00ff41 signal · #00b32d text · #007a1f dim · #003b00 border · #000000 black
set-option -g status on
set-option -g status-interval 1  # Frequent updates
set-option -g status-position bottom
set-option -g status-style "bg=#000000,fg=#00b32d"
set-option -g status-left ""
set-option -g status-right-length 80

# Window list: flush left, no separator bars. Active window = solid green
# block (black on green); inactive windows = dim green text.
setw -g automatic-rename on
set-option -g window-status-separator ""
set-window-option -g window-status-format "#[fg=#00b32d,bg=#000000] #I #{b:pane_current_path} "
set-window-option -g window-status-current-format "#[fg=#000000,bg=#00ff41,bold] #I #{b:pane_current_path} "
set-window-option -g window-status-activity-style "fg=#00ff41,bold"
set-window-option -g window-status-bell-style "fg=#000000,bg=#00ff41,bold"

# Right: prefix/zoom state, running command, session, clock — spacing, no bars.
set-option -g status-right "#{?client_prefix,#[fg=#000000]#[bg=#00ff41]#[bold] PREFIX #[default] ,}#{?window_zoomed_flag,#[fg=#00ff41]#[bold]ZOOM#[default]  ,}#[fg=#007a1f]#{b:pane_current_command}  #[fg=#00ff41,bold]#S  #[fg=#00b32d]%H:%M #[fg=#007a1f]%a %Y-%m-%d "

# Pane borders: near-invisible dark green at rest, phosphor green on focus
set-option -g pane-border-style "fg=#003b00"
set-option -g pane-active-border-style "fg=#008f11"

# Prompts, copy-mode selection, clock, pane numbers, menus/popups
set-option -g message-style "bg=#000000,fg=#00ff41,bold"
set-option -g message-command-style "bg=#000000,fg=#00b32d"
set-option -g mode-style "bg=#00ff41,fg=#000000"
set-option -g clock-mode-colour "#00ff41"
set-option -g display-panes-active-colour "#00ff41"
set-option -g display-panes-colour "#00b32d"
set-option -g menu-style "bg=#000000,fg=#00b32d"
set-option -g menu-selected-style "bg=#00ff41,fg=#000000,bold"
set-option -g menu-border-style "fg=#003b00"
set-option -g popup-style "bg=#000000"
set-option -g popup-border-style "fg=#003b00"

# ---- Keybindings ----
# Leader key: ctrl+space for ergonomic control
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enhanced window navigation
bind -n M-K previous-window
bind -n M-J next-window

# Vim-style copy mode for familiar interaction
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- Scrollback & Mouse Wheel (consolidated from former ~/.tmux.conf) ----
# Mouse wheel: for alternate-screen apps (vim, less, htop, AND Claude Code — which
# DOES use the alt screen: alternate_on=1) pass the wheel THROUGH so the app scrolls
# its own buffer. For normal shell panes, drive tmux's scrollback (copy-mode).
#
# Consequence: an alt-screen app's scrollback lives INSIDE the app, not in tmux, so
# `prefix [` (tmux copy-mode) cannot show it — that's why mouse-scroll reveals Claude's
# history but `prefix [` does not. Use the mouse or PageUp to scroll alt-screen apps;
# use `prefix [` for shell-pane scrollback, where the full 50k buffer is available.
bind -n WheelUpPane   if -F "#{alternate_on}" "send -M" "copy-mode -e"
bind -n WheelDownPane if -F "#{alternate_on}" "send -M" "send -M"

# Faster wheel: 3 lines per notch in copy-mode
bind -T copy-mode-vi WheelUpPane   send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

# PageUp/PageDown mirror the wheel: forward to alt-screen apps (so PageUp scrolls
# Claude/vim/less), else enter tmux scrollback.
bind -n PPage if -F "#{alternate_on}" "send-keys PPage" "copy-mode -u"
bind -n NPage if -F "#{alternate_on}" "send-keys NPage" "send-keys NPage"

# Intelligent pane splitting with current path preservation
bind - split-window -vc "#{pane_current_path}"
bind | split-window -hc "#{pane_current_path}"

# Custom workflow bindings
bind-key o run-shell "tmux send-keys -t . 'bash ~/.config/tmux/goto.sh' Enter"
bind r command-prompt "rename-window %%"
bind s choose-tree -Z

# ---- Plugin Management ----
# Initialize TMUX plugin manager
run "$tmux_plugins_dir/tpm/tpm"
